name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Create deploy archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='*.log' \
            --exclude='*.png' \
            --exclude='.playwright' \
            --exclude='scripts' \
            --exclude='.ruff_cache' \
            --exclude='.claude' \
            .
          ls -lh /tmp/deploy.tar.gz

      - name: Upload to Railway
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://backboard.railway.com/project/debec8ba-d05c-460f-82ed-ac7f7cd72801/environment/b3aacad6-acae-4e91-b845-c69e94599193/up?serviceId=6ea35fed-0c24-4269-8bce-29c14dee6ef7" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/deploy.tar.gz \
            --max-time 300)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Upload failed with status $HTTP_CODE"
            exit 1
          fi
          echo "Upload successful!"
