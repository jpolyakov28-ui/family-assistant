[project]
name = "family-assistant"
version = "0.1.0"
description = "Telegram bot for family of 6 — tasks, reminders, shopping, meds, menu"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "supabase>=2.10.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    "psycopg[binary]>=3.3.4",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "playwright>=1.49.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
